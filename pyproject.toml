[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = [
  "D203", "D213",       # pick one docstring style
  "PLR0913", "PLR2004", # argument counts and plain numbers are fine here
  "D105", "D107",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "PLR0915", "PLR0917"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
